<!doctype html>
<html lang="en" data-theme="snow">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tiny Doors — Advent Village</title>
  <meta name="theme-color" content="#0b1638">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Bagel+Fat+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <canvas id="ambient" aria-hidden="true"></canvas>

  <main id="village">
    <header class="top" id="top">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="garland" id="garland" aria-hidden="true"></div>
    </header>
    <div class="grid" id="grid"></div>
    <button class="credit" id="credit" type="button">✨ <span class="long">Made with <b>Tiny Doors</b> — </span>make one for someone</button>
  </main>

  <div id="foreground" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div id="overlay" hidden>
    <div class="backdrop"></div>
    <div class="card-wrap">
      <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></article>
    </div>
  </div>

  <div id="splash">
    <div class="splash-inner">
      <div class="splash-emblem" id="splashEmblem"></div>
      <p class="splash-eyebrow" id="splashEyebrow"></p>
      <h2 class="splash-title" id="splashTitle"></h2>
      <button class="btn primary big" id="splashGo" type="button">Open it ✨</button>
      <p class="splash-note">Best with sound on 🔊</p>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool" id="btnTheme" type="button" aria-label="Switch theme"></button>
    <button class="tool" id="btnSound" type="button" aria-label="Sound on">🔊</button>
    <button class="tool" id="btnFamily" type="button" aria-label="Family TV mode">📺</button>
    <a class="tool tool-text" id="btn3d" href="3d.html" aria-label="Switch to the 3D view">3D</a>
    <button class="tool" id="btnDemo" type="button" aria-label="Prototype controls">⚙️</button>
  </div>

  <aside id="panel" hidden>
    <div class="panel-head">
      <strong>Prototype controls</strong>
      <button class="close" id="panelClose" type="button" aria-label="Close">×</button>
    </div>
    <label class="row">Theme
      <span class="seg">
        <button type="button" data-theme-pick="snow">❄️ Snowy</button>
        <button type="button" data-theme-pick="summer">☀️ Summer</button>
      </span>
    </label>
    <label class="row">Pretend it's December <b id="dayOut"></b>
      <input type="range" id="dayRange" min="1" max="24">
    </label>
    <label class="row check"><input type="checkbox" id="unlockAll"> Unlock every door (for recording)</label>
    <div class="row two">
      <label>For <input type="text" id="toName" maxlength="20"></label>
      <label>From <input type="text" id="fromName" maxlength="20"></label>
    </div>
    <label class="row">Your photos <small>(go behind the 📸 days)</small>
      <input type="file" id="photoInput" accept="image/*" multiple>
    </label>
    <button class="btn ghost" id="resetBtn" type="button">Close all doors again</button>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>
  <div class="kbd-hint" id="kbdHint">← → ↑ ↓ move · <b>Enter</b> open · <b>Space</b> reveal · <b>Esc</b> close</div>

  <script src="js/i18n.js"></script>
  <script src="js/locales/fr.js"></script>
  <script src="js/i18n-init.js"></script>
  <script src="js/util.js"></script>
  <script src="js/content.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloud-db.js"></script>
  <script src="js/huts.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/drawing.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
